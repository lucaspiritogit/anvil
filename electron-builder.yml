appId: dev.anvil.app
productName: Anvil
npmRebuild: false
directories:
  buildResources: build
  output: release
files:
  # Package current entry points only; old build directories can remain locally.
  - out/main/**
  - "!out/main/valence-cli.js"
  - out/preload/**
  - out/renderer/**
  - package.json
  - out/server/**
asarUnpack:
  - node_modules/node-pty/**
  # PGlite loads its PostgreSQL and extension WebAssembly assets from disk.
  - node_modules/@electric-sql/pglite/**
  - node_modules/@electric-sql/pglite-pgvector/**
mac:
  identity: "Anvil Self-Signed"
  category: public.app-category.developer-tools
  target: dmg
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.${ext}
