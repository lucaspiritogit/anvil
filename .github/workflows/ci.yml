name: CI and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Typecheck and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'))
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error(`Release tag must match package.json: v${version}`)
          }
          NODE
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build ${{ matrix.name }}
    needs: check
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
            arguments: --mac dmg --arm64 -c.mac.identity=null
            artifact: release/*.dmg
          - name: macos-x64
            os: macos-15-intel
            arguments: --mac dmg --x64 -c.mac.identity=null
            artifact: release/*.dmg
          - name: windows-x64
            os: windows-2022
            arguments: --win nsis --x64
            artifact: release/*.exe
          - name: linux-x64
            os: ubuntu-24.04
            arguments: --linux AppImage --x64
            artifact: release/*.AppImage
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Packaging disables npmRebuild, so build both native addons for Electron.
      - run: npx electron-rebuild --force --only better-sqlite3,node-pty
      - run: node scripts/fix-pty-permissions.cjs
      - run: npx electron-vite build
      - run: npx electron-builder ${{ matrix.arguments }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish release and checksums
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: release
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: release
        run: |
          sha256sum -- *.dmg *.exe *.AppImage > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'NOTES'
          Download the binary for your platform below. These builds are unsigned.

          Download `SHA256SUMS.txt` alongside the binaries to verify their SHA-256 hashes.

          - Linux: `sha256sum --check --ignore-missing SHA256SUMS.txt`
          - macOS: `shasum -a 256 Anvil-*.dmg`, then compare with `SHA256SUMS.txt`.
          - Windows PowerShell: `Get-FileHash .\Anvil-*-setup.exe -Algorithm SHA256`, then compare with `SHA256SUMS.txt`.
          NOTES
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" release/* \
            --verify-tag --title "Anvil $RELEASE_TAG" \
            --generate-notes --notes-file release-notes.md "${prerelease[@]}"
