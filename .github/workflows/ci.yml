name: CI and release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      release_commit: ${{ steps.release.outputs.commit }}
      release_tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - name: Verify release version
        id: release
        run: |
          version=$(node --input-type=module -e "import { readFileSync } from 'node:fs'; const { version } = JSON.parse(readFileSync('package.json', 'utf8')); process.stdout.write(version)")
          tag="v${version}"
          if [[ "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version $tag" >&2
            exit 1
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build ${{ matrix.name }}
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
            arguments: --mac dmg --arm64 -c.mac.identity=null
            artifact: release/*.dmg
            server_artifact: release/Anvil-server-*-macos-arm64.tar.gz
          - name: macos-x64
            os: macos-15-intel
            arguments: --mac dmg --x64 -c.mac.identity=null
            artifact: release/*.dmg
            server_artifact: release/Anvil-server-*-macos-x64.tar.gz
          - name: windows-x64
            os: windows-2022
            arguments: --win nsis --x64
            artifact: release/*.exe
            server_artifact: release/Anvil-server-*-windows-x64.zip
          - name: linux-x64
            # Match the check job's compiler support for Electron 44's V8 headers.
            os: ubuntu-24.04
            arguments: --linux AppImage --x64
            artifact: release/*.AppImage
            server_artifact: release/Anvil-server-*-linux-x64.tar.gz
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.release_commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder ${{ matrix.arguments }} --publish never
      - run: node scripts/tests/verify-package.mjs
      - run: node scripts/package-server.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.name }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.server_artifact }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish release and checksums
    needs: [check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: release
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: release
        run: |
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.check.outputs.release_tag }}
        run: |
          cat > release-notes.md <<'NOTES'
          Download the desktop app or the Anvil server archive for your platform below. These builds are unsigned.

          Server archives include Node.js and the browser UI. Extract one and run `anvil-server` for local access, `anvil-server --lan` for password-protected LAN access, or `anvil-server --tailscale` for private Tailscale HTTPS access.

          Download `SHA256SUMS.txt` alongside the binaries to verify their SHA-256 hashes.

          - Linux: `sha256sum --check --ignore-missing SHA256SUMS.txt`
          - macOS: `shasum -a 256 Anvil-*`, then compare with `SHA256SUMS.txt`.
          - Windows PowerShell: `Get-FileHash .\Anvil-* -Algorithm SHA256`, then compare with `SHA256SUMS.txt`.
          NOTES
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" release/* \
            --verify-tag --title "Anvil $RELEASE_TAG" \
            --generate-notes --notes-file release-notes.md "${prerelease[@]}"
