name: CI and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      release_commit: ${{ steps.release.outputs.commit }}
      release_tag: ${{ steps.release.outputs.tag }}
      should_release: ${{ steps.release.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          # Node 24.20.0 headers crash better-sqlite3 during statement cleanup.
          node-version: '24.14.1'
          cache: npm
      - run: npm ci
      - name: Read release version
        id: release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          version=$(node --input-type=module -e "import { readFileSync } from 'node:fs'; const { version } = JSON.parse(readFileSync('package.json', 'utf8')); process.stdout.write(version)")
          tag="v${version}"
          should_release=true
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]] || git show-ref --verify --quiet "refs/tags/${tag}"; then
            should_release=false
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "should_release=${should_release}" >> "$GITHUB_OUTPUT"
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build ${{ matrix.name }}
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
            arguments: --mac dmg --arm64 -c.mac.identity=null
            artifact: release/*.dmg
          - name: macos-x64
            os: macos-15-intel
            arguments: --mac dmg --x64 -c.mac.identity=null
            artifact: release/*.dmg
          - name: windows-x64
            os: windows-2022
            arguments: --win nsis --x64
            artifact: release/*.exe
          - name: linux-x64
            os: ubuntu-24.04
            arguments: --linux AppImage --x64
            artifact: release/*.AppImage
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.release_commit }}
      - uses: actions/setup-node@v4
        with:
          # Node 24.20.0 headers crash better-sqlite3 during statement cleanup.
          node-version: '24.14.1'
          cache: npm
      - run: npm ci
      # Packaging disables npmRebuild, so build the SQLite native addon for Electron.
      - run: npx electron-rebuild --force --only better-sqlite3
      - run: npm run build
      - run: npx electron-builder ${{ matrix.arguments }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish release and checksums
    needs: [check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: release
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: release
        run: |
          sha256sum -- *.dmg *.exe *.AppImage > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ needs.check.outputs.release_commit }}
          RELEASE_TAG: ${{ needs.check.outputs.release_tag }}
        run: |
          cat > release-notes.md <<'NOTES'
          Download the binary for your platform below. These builds are unsigned.

          Download `SHA256SUMS.txt` alongside the binaries to verify their SHA-256 hashes.

          - Linux: `sha256sum --check --ignore-missing SHA256SUMS.txt`
          - macOS: `shasum -a 256 Anvil-*.dmg`, then compare with `SHA256SUMS.txt`.
          - Windows PowerShell: `Get-FileHash .\Anvil-*-setup.exe -Algorithm SHA256`, then compare with `SHA256SUMS.txt`.
          NOTES
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" release/* \
            --target "$RELEASE_COMMIT" --title "Anvil $RELEASE_TAG" \
            --generate-notes --notes-file release-notes.md "${prerelease[@]}"
