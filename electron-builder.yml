appId: dev.anvil.app
productName: Anvil
npmRebuild: false
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
  # Drizzle applies these at startup by reading them from disk.
  - src/main/db/migrations/**
  - src/main/memory/migrations/**
asarUnpack:
  - node_modules/node-pty/**
  - node_modules/better-sqlite3/**
  # PGlite loads its PostgreSQL and extension WebAssembly assets from disk.
  - node_modules/@electric-sql/pglite/**
  - node_modules/@electric-sql/pglite-pgvector/**
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.${ext}
