name: CI and release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      release_commit: ${{ steps.release.outputs.commit }}
      release_tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - name: Verify release version
        id: release
        run: |
          version=$(node --input-type=module -e "import { readFileSync } from 'node:fs'; const { version } = JSON.parse(readFileSync('package.json', 'utf8')); process.stdout.write(version)")
          tag="v${version}"
          if [[ "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version $tag" >&2
            exit 1
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build ${{ matrix.name }}
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
            arguments: --mac dmg --arm64 -c.forceCodeSigning=true
            artifact: release/*.dmg
            server_artifact: release/Anvil-server-*-macos-arm64.tar.gz
          - name: macos-x64
            os: macos-15-intel
            arguments: --mac dmg --x64 -c.forceCodeSigning=true
            artifact: release/*.dmg
            server_artifact: release/Anvil-server-*-macos-x64.tar.gz
          - name: windows-x64
            os: windows-2022
            arguments: --win nsis --x64
            artifact: release/*.exe
            server_artifact: release/Anvil-server-*-windows-x64.zip
          - name: linux-x64
            # Match the check job's compiler support for Electron 44's V8 headers.
            os: ubuntu-24.04
            arguments: --linux AppImage --x64
            artifact: release/*.AppImage
            server_artifact: release/Anvil-server-*-linux-x64.tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.release_commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npm run test:node-pty
      - name: Import macOS signing identity
        if: runner.os == 'macOS'
        shell: bash
        env:
          SIGNING_P12_BASE64: ${{ secrets.ANVIL_SIGNING_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.ANVIL_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "$SIGNING_P12_BASE64" ]]; then
            echo "ANVIL_SIGNING_P12_BASE64 is not configured" >&2
            exit 1
          fi
          if [[ -z "$SIGNING_P12_PASSWORD" ]]; then
            echo "ANVIL_SIGNING_P12_PASSWORD is not configured" >&2
            exit 1
          fi

          signing_p12="$RUNNER_TEMP/anvil-signing.p12"
          signing_cert="$RUNNER_TEMP/anvil-signing.pem"
          signing_keychain="$RUNNER_TEMP/anvil-signing.keychain-db"
          signing_keychain_password="$(openssl rand -hex 32)"

          echo "::add-mask::$signing_keychain_password"
          trap 'rm -f "$signing_p12" "$signing_cert"' EXIT

          printf '%s' "$SIGNING_P12_BASE64" |
            /usr/bin/base64 -D > "$signing_p12"

          security create-keychain \
            -p "$signing_keychain_password" "$signing_keychain"
          security set-keychain-settings \
            -lut 21600 "$signing_keychain"
          security unlock-keychain \
            -p "$signing_keychain_password" "$signing_keychain"

          security import "$signing_p12" \
            -k "$signing_keychain" \
            -P "$SIGNING_P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$signing_keychain_password" \
            "$signing_keychain"
          security list-keychains -d user -s \
            "$signing_keychain" \
            "$HOME/Library/Keychains/login.keychain-db"

          security find-certificate \
            -c "Anvil Self-Signed" \
            -p "$signing_keychain" > "$signing_cert"
          security add-trusted-cert \
            -r trustRoot \
            -p codeSign \
            -k "$signing_keychain" \
            "$signing_cert"

          signing_identities="$(security find-identity -v -p codesigning "$signing_keychain")"
          printf '%s\n' "$signing_identities"
          if [[ "$signing_identities" != *'"Anvil Self-Signed"'* ]]; then
            echo "Anvil Self-Signed is not a valid code-signing identity" >&2
            exit 1
          fi
      - run: npm run build
      - run: npx electron-builder ${{ matrix.arguments }} --publish never
      - name: Verify macOS app signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app_path="release/mac/Anvil.app"
          if [[ "${{ matrix.name }}" == "macos-arm64" ]]; then
            app_path="release/mac-arm64/Anvil.app"
          fi

          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign --display --verbose=2 "$app_path"
      - run: node scripts/tests/verify-package.mjs
      - run: node scripts/package-server.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.name }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.server_artifact }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish release and checksums
    needs: [check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: release
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: release
        run: |
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.check.outputs.release_tag }}
        run: |
          cat > release-notes.md <<'NOTES'
          Download the desktop app or the Anvil server archive for your platform below.
          macOS desktop builds use Anvil's self-signed certificate and are not notarized by Apple.
          macOS may require an explicit security override on first launch.

          Server archives include Node.js and the browser UI. Extract one and run `anvil-server` for local access, `anvil-server --lan` for password-protected LAN access, or `anvil-server --tailscale` for private Tailscale HTTPS access.

          Download `SHA256SUMS.txt` alongside the binaries to verify their SHA-256 hashes.

          - Linux: `sha256sum --check --ignore-missing SHA256SUMS.txt`
          - macOS: `shasum -a 256 Anvil-*`, then compare with `SHA256SUMS.txt`.
          - Windows PowerShell: `Get-FileHash .\Anvil-* -Algorithm SHA256`, then compare with `SHA256SUMS.txt`.
          NOTES
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" release/* \
            --verify-tag --title "Anvil $RELEASE_TAG" \
            --generate-notes --notes-file release-notes.md "${prerelease[@]}"

  homebrew:
    name: Update Homebrew tap
    needs: [check, release]
    if: ${{ !contains(needs.check.outputs.release_tag, '-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download macOS DMGs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.check.outputs.release_tag }}
        run: |
          gh release download "$RELEASE_TAG" \
            --pattern 'Anvil-*-arm64.dmg' \
            --pattern 'Anvil-*-x64.dmg'
      - name: Update tap cask
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TAG: ${{ needs.check.outputs.release_tag }}
        run: |
          version="${RELEASE_TAG#v}"
          arm_sha=$(sha256sum "Anvil-${version}-arm64.dmg" | cut -d ' ' -f 1)
          intel_sha=$(sha256sum "Anvil-${version}-x64.dmg" | cut -d ' ' -f 1)

          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/lucaspiritogit/homebrew-tap.git" tap
          cask="tap/Casks/anvil.rb"
          sed -i -E "s/^  version \".*\"/  version \"${version}\"/" "$cask"
          sed -i -E "s/^  sha256 arm:   \".*\"/  sha256 arm:   \"${arm_sha}\"/" "$cask"
          sed -i -E "s/^         intel: \".*\"/         intel: \"${intel_sha}\"/" "$cask"

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/anvil.rb
          if git diff --cached --quiet; then
            echo "Cask is already up to date."
          else
            git commit -m "anvil ${version}"
            git push
          fi
