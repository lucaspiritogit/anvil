appId: dev.anvil.app
productName: Anvil
npmRebuild: false
publish:
  provider: generic
  url: https://pub-902a1faca35b4a8a8e268e9829ec6aab.r2.dev
directories:
  buildResources: build
  output: release
files:
  # Package current entry points only; old build directories can remain locally.
  - out/main/**
  - out/preload/**
  - package.json
  - out/server/**
asarUnpack:
  - node_modules/node-pty/**
  # PGlite loads its PostgreSQL and extension WebAssembly assets from disk.
  - node_modules/@electric-sql/pglite/**
  - node_modules/@electric-sql/pglite-pgvector/**
mac:
  identity: "-"
  sign: scripts/sign-macos.cjs
  timestamp: none
  category: public.app-category.developer-tools
  artifactName: ${productName}-${version}-${arch}-mac.${ext}
  target:
    - dmg
    - zip
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.${ext}
